name: Sync AWAvenue Rules

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动运行
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 允许 workflow 推送提交到仓库

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and clean rules
        run: |
          set -euo pipefail

          # 上游原始文件（通过 boki 代理镜像，避免 GitHub raw 在部分地区被墙）
          HOSTS_URL="https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-hosts.txt"
          ADGUARD_URL="https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Adguard.txt"

          echo "::group::Download upstream"
          curl -fsSL "$HOSTS_URL" -o raw-hosts.txt
          curl -fsSL "$ADGUARD_URL" -o raw-adguard.txt
          echo "Hosts:   $(wc -l < raw-hosts.txt) lines"
          echo "AdGuard: $(wc -l < raw-adguard.txt) lines"
          echo "::endgroup::"

          echo "::group::Cleaning"

          python3 << 'PYEOF'
          # ---------- hosts 版本 ----------
          # 要求：只把行首 ! 换成 #，其余所有信息原样保留
          #       不删 localhost、不动空行、不去行尾空白、不改编码
          with open('raw-hosts.txt', 'r', encoding='utf-8', errors='replace') as f:
              hosts_lines = f.read().splitlines(keepends=True)

          hosts_out = []
          for line in hosts_lines:
              if line.startswith('!'):
                  line = '#' + line[1:]
              hosts_out.append(line)

          with open('hosts.txt', 'w', encoding='utf-8', newline='') as f:
              f.writelines(hosts_out)
          print(f"Hosts cleaned: {len(hosts_out)} lines")

          # ---------- AdGuard 版本 ----------
          # 要求：清除全部注释（! 开头）和空行，只留纯规则
          with open('raw-adguard.txt', 'r', encoding='utf-8', errors='replace') as f:
              ad_lines = f.read().splitlines()

          ad_out = []
          for line in ad_lines:
              stripped = line.strip()
              if not stripped:
                  continue
              if stripped.startswith('!'):
                  continue
              ad_out.append(stripped)

          with open('adguard.txt', 'w', encoding='utf-8', newline='\n') as f:
              f.write('\n'.join(ad_out) + '\n')
          print(f"AdGuard cleaned: {len(ad_out)} lines")
          PYEOF

          echo "::endgroup::"

          echo "::group::Result preview"
          echo "--- hosts.txt (first 12) ---"
          head -n 12 hosts.txt
          echo "..."
          echo "--- adguard.txt (first 12) ---"
          head -n 12 adguard.txt
          echo "..."
          echo "adguard.txt total: $(wc -l < adguard.txt) lines"
          echo "::endgroup::"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=0
          # hosts.txt
          if git diff --quiet -- hosts.txt 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q '^hosts.txt$'; then
            :
          else
            git add hosts.txt
            changed=1
          fi
          # adguard.txt
          if git diff --quiet -- adguard.txt 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q '^adguard.txt$'; then
            :
          else
            git add adguard.txt
            changed=1
          fi

          if [ "$changed" -eq 0 ]; then
            echo "No changes, skip commit."
            exit 0
          fi

          git commit -m "chore: sync AWAvenue rules $(date -u +%Y-%m-%d)"
          git push
